# Phase 1: Full CHT stack (haproxy, api, sentinel, nginx)
# Joins the existing cht-net network where CouchDB is already running.
#
# Prerequisites:
#   1. CouchDB running on cht-net (~/cht-docker)
#   2. CHT images built: cd ~/ai_medic/cht-core && npm run local-images
#   3. .env file populated
#
# Usage:
#   docker compose -f docker-compose.services.yml up -d
#   # Wait for API readiness, then:
#   ./scripts/phase-gate.sh approve 1

services:
  haproxy:
    image: medicmobile/cht-haproxy:${VERSION}
    container_name: cht-haproxy
    hostname: haproxy
    restart: always
    environment:
      - HAPROXY_IP=${HAPROXY_IP:-haproxy}
      - COUCHDB_USER=${COUCHDB_USER:-admin}
      - COUCHDB_PASSWORD=${COUCHDB_PASSWORD}
      - COUCHDB_SERVERS=${COUCHDB_SERVERS:-couchdb}
      - HAPROXY_PORT=${HAPROXY_PORT:-5984}
      - HEALTHCHECK_ADDR=${HEALTHCHECK_ADDR:-healthcheck}
      - DOCKER_DNS_RESOLVER=true
    logging:
      driver: "local"
      options:
        max-size: "50m"
        max-file: "20"
    networks:
      - cht-net
    deploy:
      resources:
        limits:
          memory: 1G
    expose:
      - ${HAPROXY_PORT:-5984}

  api:
    image: medicmobile/cht-api:${VERSION}
    container_name: cht-api
    hostname: api
    restart: always
    depends_on:
      - haproxy
    expose:
      - "${API_PORT:-5988}"
    environment:
      - COUCH_URL=http://${COUCHDB_USER:-admin}:${COUCHDB_PASSWORD}@haproxy:${HAPROXY_PORT:-5984}/medic
      - BUILDS_URL=${MARKET_URL_READ:-https://staging.dev.medicmobile.org}/${BUILDS_SERVER:-_couch/builds_4}
      - NODE_ENV=development
      - LOG_LEVEL=debug
    logging:
      driver: "local"
      options:
        max-size: "50m"
        max-file: "20"
    networks:
      - cht-net

  sentinel:
    image: medicmobile/cht-sentinel:${VERSION}
    container_name: cht-sentinel
    hostname: sentinel
    restart: always
    depends_on:
      - haproxy
    environment:
      - COUCH_URL=http://${COUCHDB_USER:-admin}:${COUCHDB_PASSWORD}@haproxy:${HAPROXY_PORT:-5984}/medic
      - API_HOST=api
      - LOG_LEVEL=debug
    logging:
      driver: "local"
      options:
        max-size: "50m"
        max-file: "20"
    networks:
      - cht-net

  nginx:
    image: medicmobile/cht-nginx:${VERSION}
    container_name: cht-nginx
    hostname: nginx
    restart: always
    depends_on:
      - api
      - haproxy
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - cht-ssl:/etc/nginx/private/
    environment:
      - API_HOST=api
      - API_PORT=${API_PORT:-5988}
      - CERTIFICATE_MODE=${CERTIFICATE_MODE:-SELF_SIGNED}
      - SSL_CERT_FILE_PATH=/etc/nginx/private/cert.pem
      - SSL_KEY_FILE_PATH=/etc/nginx/private/key.pem
      - COMMON_NAME=localhost
    logging:
      driver: "local"
      options:
        max-size: "50m"
        max-file: "20"
    networks:
      - cht-net

volumes:
  cht-ssl:

networks:
  cht-net:
    external: true
    name: ${CHT_NETWORK:-cht-net}
