# CHT PowerSync Service Configuration (Self-Hosted)
# See: https://docs.powersync.com/configuration/powersync-service/self-hosted-instances

# Source database: PostgreSQL with CHT data via cht-sync
replication:
  connections:
    - type: postgresql
      uri: !env PS_DATABASE_URI
      sslmode: disable  # Local Docker network only

# Bucket storage: separate database on same PostgreSQL server
# Isolates bucket I/O from source WAL replication
storage:
  type: postgresql
  uri: !env PS_STORAGE_URI
  sslmode: disable

# API port
port: 8080

# Admin API for diagnostics and sync rule validation
api:
  tokens:
    - !env PS_ADMIN_TOKEN
  # Raise from default 1000 to support per-county deployments where
  # supervisors/admins see >1000 facilities, each becoming a bucket.
  # See context/POWERSYNC_BUCKET_ARCHITECTURE_TRADEOFFS.md for analysis.
  parameters:
    max_parameter_query_results: 20000
    max_buckets_per_connection: 20000

# Sync config inlined to avoid file path issues across container mounts.
# Streams consolidated by CTE to minimize bucket count (CTE sharing).
# Table aliases in FROM clause determine client-side table names (edition 3).
# See sync-config.yaml for the standalone reference version with full comments.
sync_config:
  content: |
    config:
      edition: 3

    streams:
      # Unified stream: contacts + SMS + targets + reports
      # All 6 queries share one accessible_facilities CTE → N shared buckets.
      # Merging accessible_data + report_data eliminates duplicate bucket
      # namespaces. Denormalized resolved_subject_id eliminates JOIN overhead.
      # Trade-off: reports use accessible_facilities (replication_depth) instead
      # of report_facilities (report_depth). Users with report_depth < depth
      # may over-sync reports; client-side SQLite can filter. For report_depth=-1
      # (most common), no change.
      # With Step 1.5 removed, accessible_facilities contains only places
      # (~52 entries, not ~8,055). Person contacts and SMS match via JOIN
      # to contact_parent_place. Reports match via resolved_subject_place_id.
      # Buckets: N (shared CTE) + 1 (own) + 1 (needs_signoff) = N + 2
      all_data:
        auto_subscribe: true
        priority: 1
        with:
          accessible_facilities: |
            SELECT facility_id
            FROM "v1"."user_accessible_facilities"
            WHERE user_id = auth.user_id()
        queries:
          # -- Place contacts (matched by _id in CTE) --
          # Matches clinics, HCs, districts, and any contacts whose _id is
          # directly in accessible_facilities (including primary contacts
          # and the user's own contact from Steps 3-4).
          - |
            SELECT
              contacts._id AS id,
              contacts.doc ->> 'name' AS name,
              ifnull(contacts.doc ->> 'contact_type', contacts.doc ->> 'type') AS contact_type,
              ifnull(contacts.doc -> 'parent' ->> '_id', contacts.doc ->> 'parent') AS parent_id,
              contacts.doc ->> 'patient_id' AS patient_id,
              contacts.doc ->> 'place_id' AS place_id,
              contacts.doc ->> 'phone' AS phone,
              contacts.doc ->> 'date_of_birth' AS date_of_birth,
              contacts.doc ->> 'sex' AS sex,
              contacts.doc ->> 'reported_date' AS reported_date,
              CAST(contacts.doc AS TEXT) AS doc
            FROM "v1"."couchdb" contacts
            WHERE contacts._deleted != true
              AND contacts.doc ->> 'type' IN '["contact", "person", "clinic", "health_center", "district_hospital"]'
              AND contacts._id IN accessible_facilities
          # -- Person contacts (children of accessible places, direct match) --
          # Matches persons whose parent_id is in accessible_facilities.
          # Uses the generated parent_id column directly — NO JOIN, so
          # bucket count = CTE size (~53), not JOIN cardinality (~8,000).
          - |
            SELECT
              contacts._id AS id,
              contacts.doc ->> 'name' AS name,
              ifnull(contacts.doc ->> 'contact_type', contacts.doc ->> 'type') AS contact_type,
              ifnull(contacts.doc -> 'parent' ->> '_id', contacts.doc ->> 'parent') AS parent_id,
              contacts.doc ->> 'patient_id' AS patient_id,
              contacts.doc ->> 'place_id' AS place_id,
              contacts.doc ->> 'phone' AS phone,
              contacts.doc ->> 'date_of_birth' AS date_of_birth,
              contacts.doc ->> 'sex' AS sex,
              contacts.doc ->> 'reported_date' AS reported_date,
              CAST(contacts.doc AS TEXT) AS doc
            FROM "v1"."couchdb" contacts
            WHERE contacts._deleted != true
              AND contacts.doc ->> 'type' IN '["contact", "person"]'
              AND contacts.parent_id IN accessible_facilities
          # -- SMS Messages --
          # TODO: SMS contact._id points to a person. Need a stored
          # contact_parent_id column on couchdb (cross-row lookup at insert
          # time via trigger). Subqueries not supported in this position.
          # Disabled for now — zero SMS in test data. Re-enable after
          # adding the denormalized column.
          # - |
          #   SELECT sms_messages._id AS id, ...
          #   FROM "v1"."couchdb" sms_messages
          #   WHERE ... AND sms_messages.contact_parent_id IN accessible_facilities
          # -- Targets --
          - |
            SELECT
              targets._id AS id,
              targets.doc ->> 'owner' AS owner,
              targets.doc ->> 'reporting_period' AS reporting_period,
              CAST(targets.doc -> 'targets' AS TEXT) AS targets_data,
              CAST(targets.doc AS TEXT) AS doc
            FROM "v1"."couchdb" targets
            WHERE targets._deleted != true
              AND targets.doc ->> 'type' = 'target'
              AND targets.doc ->> 'owner' IN accessible_facilities
          # -- Subject-matched reports (via subject's containing place) --
          # Uses resolved_subject_place_id: for person subjects this is the
          # parent clinic, for place subjects this is the place itself.
          # Matches against accessible_facilities which now contains only
          # places (~52 entries), not person IDs (~8,055).
          - |
            SELECT
              reports._id AS id,
              reports.doc ->> 'form' AS form,
              reports.doc ->> 'patient_id' AS patient_id,
              reports.doc -> 'contact' ->> '_id' AS submitter_id,
              reports.doc ->> 'reported_date' AS reported_date,
              reports.doc -> 'fields' ->> 'private' AS is_private,
              reports.doc -> 'fields' ->> 'needs_signoff' AS needs_signoff,
              CAST(reports.doc -> 'fields' AS TEXT) AS fields,
              CAST(reports.doc AS TEXT) AS doc
            FROM "v1"."couchdb" reports
            WHERE reports._deleted != true
              AND reports.doc ->> 'type' = 'data_record'
              AND reports.doc ->> 'form' IS NOT NULL
              AND reports.resolved_subject_place_id IN accessible_facilities
              AND (
                ifnull(reports.doc -> 'fields' ->> 'private', 'false') != 'true'
                OR reports.doc -> 'contact' ->> '_id' = auth.parameter('contact_id')
              )
          # -- User's own reports --
          - |
            SELECT
              reports._id AS id,
              reports.doc ->> 'form' AS form,
              reports.doc ->> 'patient_id' AS patient_id,
              reports.doc -> 'contact' ->> '_id' AS submitter_id,
              reports.doc ->> 'reported_date' AS reported_date,
              reports.doc -> 'fields' ->> 'private' AS is_private,
              reports.doc -> 'fields' ->> 'needs_signoff' AS needs_signoff,
              CAST(reports.doc -> 'fields' AS TEXT) AS fields,
              CAST(reports.doc AS TEXT) AS doc
            FROM "v1"."couchdb" reports
            WHERE reports._deleted != true
              AND reports.doc ->> 'type' = 'data_record'
              AND reports.doc ->> 'form' IS NOT NULL
              AND reports.doc -> 'contact' ->> '_id' = auth.parameter('contact_id')
          # -- Needs-signoff via pre-computed visibility (1 bucket) --
          - |
            SELECT
              reports._id AS id,
              reports.doc ->> 'form' AS form,
              reports.doc ->> 'patient_id' AS patient_id,
              reports.doc -> 'contact' ->> '_id' AS submitter_id,
              reports.doc ->> 'reported_date' AS reported_date,
              reports.doc -> 'fields' ->> 'private' AS is_private,
              reports.doc -> 'fields' ->> 'needs_signoff' AS needs_signoff,
              CAST(reports.doc -> 'fields' AS TEXT) AS fields,
              CAST(reports.doc AS TEXT) AS doc
            FROM "v1"."couchdb" reports
            INNER JOIN "v1"."report_needs_signoff_visible" rnsv
              ON rnsv.report_id = reports._id
              AND rnsv.visible_to_user = auth.user_id()
            WHERE reports._deleted != true
              AND reports.doc ->> 'type' = 'data_record'
              AND reports.doc ->> 'form' IS NOT NULL
              AND reports.doc -> 'fields' ->> 'needs_signoff' = 'true'
              AND (
                ifnull(reports.doc -> 'fields' ->> 'private', 'false') != 'true'
                OR reports.doc -> 'contact' ->> '_id' = auth.parameter('contact_id')
              )

      # Unassigned reports (no subject, requires can_view_unallocated)
      unassigned_reports:
        auto_subscribe: true
        priority: 3
        query: |
          SELECT
            reports._id AS id,
            reports.doc ->> 'form' AS form,
            reports.doc ->> 'patient_id' AS patient_id,
            reports.doc -> 'contact' ->> '_id' AS submitter_id,
            reports.doc ->> 'reported_date' AS reported_date,
            reports.doc -> 'fields' ->> 'private' AS is_private,
            reports.doc -> 'fields' ->> 'needs_signoff' AS needs_signoff,
            CAST(reports.doc -> 'fields' AS TEXT) AS fields,
            CAST(reports.doc AS TEXT) AS doc
          FROM "v1"."couchdb" reports
          WHERE reports._deleted != true
            AND reports.doc ->> 'type' = 'data_record'
            AND reports.doc ->> 'form' IS NOT NULL
            AND ifnull(reports.doc ->> 'patient_id', '') = ''
            AND ifnull(reports.doc -> 'fields' ->> 'patient_id', '') = ''
            AND ifnull(reports.doc ->> 'place_id', '') = ''
            AND ifnull(reports.doc -> 'fields' ->> 'place_id', '') = ''
            AND ifnull(reports.doc ->> 'patient_uuid', '') = ''
            AND ifnull(reports.doc -> 'fields' ->> 'patient_uuid', '') = ''
            AND ifnull(reports.doc ->> 'place_uuid', '') = ''
            AND ifnull(reports.doc -> 'fields' ->> 'place_uuid', '') = ''
            AND ifnull(reports.doc -> 'contact' ->> '_id', '') = ''
            AND auth.parameter('can_view_unallocated') = 'true'

      tasks:
        auto_subscribe: true
        priority: 3
        query: |
          SELECT
            tasks._id AS id,
            tasks.doc ->> 'user' AS task_user,
            tasks.doc ->> 'owner' AS owner,
            tasks.doc ->> 'requester' AS requester,
            tasks.doc ->> 'state' AS state,
            tasks.doc ->> 'emission' AS emission_id,
            tasks.doc ->> 'dueDate' AS due_date,
            tasks.doc ->> 'startDate' AS start_date,
            tasks.doc ->> 'endDate' AS end_date,
            CAST(tasks.doc AS TEXT) AS doc
          FROM "v1"."couchdb" tasks
          WHERE tasks._deleted != true
            AND tasks.doc ->> 'type' = 'task'
            AND tasks.doc ->> 'user' = auth.user_id()

      global_config:
        auto_subscribe: true
        priority: 1
        queries:
          - |
            SELECT
              global_config._id AS id,
              global_config.doc ->> 'type' AS doc_type,
              CAST(global_config.doc AS TEXT) AS doc
            FROM "v1"."couchdb" global_config
            WHERE global_config._deleted != true
              AND global_config.doc ->> 'type' IN '["form", "translations"]'
          - |
            SELECT
              global_config._id AS id,
              global_config.doc ->> 'type' AS doc_type,
              CAST(global_config.doc AS TEXT) AS doc
            FROM "v1"."couchdb" global_config
            WHERE global_config._deleted != true
              AND global_config._id IN '["resources", "branding", "partners", "service-worker-meta", "zscore-charts", "settings", "privacy-policies", "_design/medic-client"]'

      user_settings_doc:
        auto_subscribe: true
        priority: 1
        query: |
          SELECT
            user_settings_doc._id AS id,
            user_settings_doc.doc ->> 'type' AS doc_type,
            CAST(user_settings_doc.doc AS TEXT) AS doc
          FROM "v1"."couchdb" user_settings_doc
          WHERE user_settings_doc._deleted != true
            AND user_settings_doc._id = auth.user_id()

      user_meta:
        auto_subscribe: true
        priority: 3
        query: |
          SELECT
            user_meta._id AS id,
            user_meta.doc ->> 'type' AS meta_type,
            user_meta.doc ->> 'user' AS user_id,
            CAST(user_meta.doc AS TEXT) AS doc
          FROM "v1"."couchdb" user_meta
          WHERE user_meta._deleted != true
            AND (
              substring(user_meta._id, 1, 10) = 'telemetry-'
              OR substring(user_meta._id, 1, 9) = 'feedback-'
              OR substring(user_meta._id, 1, 12) = 'read:report:'
            )
            AND user_meta.doc ->> 'user' = auth.user_id()

