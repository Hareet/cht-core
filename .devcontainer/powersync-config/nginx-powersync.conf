user nginx;
worker_processes auto;

events {
    worker_connections 10240;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile              on;
    keepalive_timeout     3600;
    proxy_read_timeout    3600;
    client_max_body_size  32M;
    server_tokens         off;

    map $http_accept $error_extension {
        default html;
        ~application/json json;
    }

    server {
        listen         80;
        location ^~ /.well-known/acme-challenge/ {
            default_type "text/plain";
            root /etc/nginx/private/certbot;
        }
        location / {
            return 301 https://$host$request_uri;
        }
        include /etc/nginx/conf.d/error_pages.conf;
    }

    server {
        listen              443 ssl;
        listen              [::]:443 ssl;
        http2               on;

        gzip                on;
        gzip_vary           on;
        gzip_proxied        any;
        gzip_comp_level     6;
        gzip_buffers        16 8k;
        gzip_http_version   1.1;

        gzip_types                  text/plain text/css text/csv text/xml text/javascript
                                    application/json application/x-javascript application/xml
                                    application/vnd.ms-fontobject application/octet-stream
                                    application/x-font-woff multipart/related image/svg+xml;

        ssl_certificate             /etc/nginx/private/cert.pem;
        ssl_certificate_key         /etc/nginx/private/key.pem;
        ssl_prefer_server_ciphers   off;
        ssl_session_timeout         10m;
        ssl_session_cache           shared:SSL:10m;
        ssl_protocols               TLSv1.2 TLSv1.3;
        ssl_ciphers                 ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305;
        ssl_ecdh_curve              secp384r1;
        ssl_session_tickets         off;

        add_header X-Frame-Options  SAMEORIGIN;

        # Serve PowerSync static assets (worker JS, WASM binaries) from the API.
        # Regex location takes priority over prefix location /powersync/.
        location ~ ^/powersync/.*\.(js|wasm|map)$ {
            proxy_pass http://api:5988$request_uri;
        }

        # PowerSync WebSocket proxy
        location /powersync/ {
            proxy_pass http://powersync:8080/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        include /etc/nginx/conf.d/server.conf;
        include /etc/nginx/conf.d/error_pages.conf;
    }
}
