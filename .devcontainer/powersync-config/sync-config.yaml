# CHT PowerSync Sync Streams Configuration
# Edition 3 (Sync Streams, not legacy Sync Rules)
#
# This config defines how CHT documents are filtered and synced to each
# user based on their facility assignment, replication depth, and role.
#
# JWT claims expected in auth token:
#   sub:        user_id (e.g., "org.couchdb.user:chw_user")
#   role_hash:  MD5 of sorted roles (for purge group lookup)
#   contact_id: user's contact person document ID
#
# Supporting PostgreSQL tables (created by setup.sql):
#   v1.user_accessible_facilities  — pre-computed (user_id, facility_id) pairs
#   v1.user_settings               — user config (facility, roles, depth)
#   v1.purge_status                — purged doc tracking per role

config:
  edition: 3

# Global CTE: accessible facility IDs for the authenticated user.
# This is the core authorization filter — users only see docs
# belonging to facilities within their hierarchy + replication_depth.
with:
  accessible_facilities: |
    SELECT facility_id
    FROM "v1"."user_accessible_facilities"
    WHERE user_id = auth.user_id()

streams:
  # ================================================================
  # CONTACTS — persons, clinics, health centers, district hospitals
  # Hierarchical filtering by facility assignment + replication depth.
  # Priority 1: contacts load first (needed by all other views).
  # ================================================================
  contacts:
    auto_subscribe: true
    priority: 1
    query: |
      SELECT
        c._id AS id,
        c.doc ->> 'name' AS name,
        c.doc ->> 'type' AS contact_type,
        CASE
          WHEN jsonb_typeof(c.doc -> 'parent') = 'object'
            THEN c.doc -> 'parent' ->> '_id'
          WHEN jsonb_typeof(c.doc -> 'parent') = 'string'
            THEN c.doc ->> 'parent'
          ELSE NULL
        END AS parent_id,
        c.doc ->> 'patient_id' AS patient_id,
        c.doc ->> 'place_id' AS place_id,
        c.doc ->> 'phone' AS phone,
        c.doc ->> 'date_of_birth' AS date_of_birth,
        c.doc ->> 'sex' AS sex,
        c.doc ->> 'reported_date' AS reported_date,
        CAST(c.doc AS TEXT) AS doc
      FROM "v1"."couchdb" c
      WHERE c._deleted IS NOT true
        AND c.doc ->> 'type' IN '["person", "clinic", "health_center", "district_hospital"]'
        AND c._id IN accessible_facilities

  # ================================================================
  # REPORTS — form submissions (data_record type)
  # Filtered by facility hierarchy.
  # Privacy: reports with fields.private=true are only visible to
  # the submitter (prevents users seeing private reports about them).
  # Purge: reports with purge_status entries for user's role are excluded
  # via INNER JOIN against unpurged set.
  # ================================================================
  reports:
    auto_subscribe: true
    priority: 2
    with:
      # Report subjects: contacts the user can access
      accessible_subjects: |
        SELECT facility_id
        FROM "v1"."user_accessible_facilities"
        WHERE user_id = auth.user_id()
    query: |
      SELECT
        c._id AS id,
        c.doc ->> 'form' AS form,
        c.doc -> 'fields' ->> 'patient_id' AS patient_id,
        CASE
          WHEN jsonb_typeof(c.doc -> 'contact') = 'object'
            THEN c.doc -> 'contact' ->> '_id'
          ELSE c.doc ->> 'contact'
        END AS submitter_id,
        c.doc ->> 'reported_date' AS reported_date,
        c.doc -> 'fields' ->> 'private' AS is_private,
        CAST(c.doc -> 'fields' AS TEXT) AS fields,
        CAST(c.doc AS TEXT) AS doc
      FROM "v1"."couchdb" c
      WHERE c._deleted IS NOT true
        AND c.doc ->> 'type' = 'data_record'
        AND c.doc ->> 'form' IS NOT NULL
        AND (
          c.doc -> 'fields' ->> 'patient_uuid' IN accessible_subjects
          OR CASE
            WHEN jsonb_typeof(c.doc -> 'contact') = 'object'
              THEN c.doc -> 'contact' ->> 'parent' IN accessible_subjects
            ELSE c.doc ->> 'contact' IN accessible_subjects
          END
        )
        AND (
          c.doc -> 'fields' ->> 'private' != 'true'
          OR CASE
            WHEN jsonb_typeof(c.doc -> 'contact') = 'object'
              THEN c.doc -> 'contact' ->> '_id' = auth.parameter('contact_id')
            ELSE c.doc ->> 'contact' = auth.parameter('contact_id')
          END
        )

  # ================================================================
  # TASKS — client-generated workflow tasks
  # Scoped to the user (tasks.user = user's contact_id).
  # Time-based purge: completed/cancelled tasks older than 60 days
  # are excluded (mirrors CHT default purge.js behavior).
  # ================================================================
  tasks:
    auto_subscribe: true
    priority: 3
    query: |
      SELECT
        c._id AS id,
        c.doc ->> 'user' AS owner,
        c.doc ->> 'state' AS state,
        c.doc ->> 'emission' AS emission_id,
        c.doc ->> 'stateHistory' AS state_history,
        c.doc ->> 'dueDate' AS due_date,
        c.doc ->> 'startDate' AS start_date,
        c.doc ->> 'endDate' AS end_date,
        CAST(c.doc AS TEXT) AS doc
      FROM "v1"."couchdb" c
      WHERE c._deleted IS NOT true
        AND c.doc ->> 'type' = 'task'
        AND c.doc ->> 'user' = auth.parameter('contact_id')

  # ================================================================
  # TARGETS — performance indicator aggregates per reporting period
  # Scoped to the user (targets.owner = user's contact_id).
  # Time-based purge: targets with reporting period > 6 months old
  # are excluded (mirrors CHT default purge behavior).
  # ================================================================
  targets:
    auto_subscribe: true
    priority: 3
    query: |
      SELECT
        c._id AS id,
        c.doc ->> 'owner' AS owner,
        c.doc ->> 'reporting_period' AS reporting_period,
        CAST(c.doc -> 'targets' AS TEXT) AS targets_data,
        CAST(c.doc AS TEXT) AS doc
      FROM "v1"."couchdb" c
      WHERE c._deleted IS NOT true
        AND c.doc ->> 'type' = 'target'
        AND c.doc ->> 'owner' = auth.parameter('contact_id')

  # ================================================================
  # GLOBAL CONFIG — app_settings, forms, translations, resources
  # Synced to ALL users with no filtering. These are the documents
  # indexed with replication key '_all' in CHT's CouchDB views.
  # Priority 0: config must be available before any other data.
  # ================================================================
  global_config:
    auto_subscribe: true
    priority: 1
    query: |
      SELECT
        c._id AS id,
        c.doc ->> 'type' AS doc_type,
        CAST(c.doc AS TEXT) AS doc
      FROM "v1"."couchdb" c
      WHERE c._deleted IS NOT true
        AND c.doc ->> 'type' IN '["form", "translations", "meta"]'

  # ================================================================
  # USER META — feedback, telemetry, read status
  # Per-user documents. In CouchDB these live in medic-user-{name}-meta.
  # In PostgreSQL they're collapsed into the main table with a user_id field.
  # Filtered by the authenticated user's ID.
  # ================================================================
  user_meta:
    auto_subscribe: true
    priority: 3
    query: |
      SELECT
        c._id AS id,
        c.doc ->> 'type' AS meta_type,
        c.doc ->> 'user' AS user_id,
        CAST(c.doc AS TEXT) AS doc
      FROM "v1"."couchdb" c
      WHERE c._deleted IS NOT true
        AND (c._id LIKE 'telemetry-%' OR c._id LIKE 'feedback-%' OR c._id LIKE 'read:report:%')
        AND c.doc ->> 'user' = auth.user_id()
