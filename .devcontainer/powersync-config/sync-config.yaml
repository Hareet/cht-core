# CHT PowerSync Sync Streams Configuration
# Edition 3 (Sync Streams, not legacy Sync Rules)
#
# IMPORTANT: Only PowerSync-supported SQL is used in this file.
# Supported: SELECT, WHERE, AND, OR, NOT, =, !=, IS NULL, IS NOT NULL,
#   IN (subquery), IN 'json_array', INNER JOIN, CASE/WHEN, BETWEEN,
#   ->, ->>, CAST, ifnull, iif, substring, length, instr,
#   datetime, unixepoch (time-value arg required, no current-time)
# NOT supported: COALESCE, LIKE, LIMIT, GROUP BY, ORDER BY, jsonb_typeof,
#   NOT IN (subquery), LEFT/RIGHT JOIN, aggregation, NOW()
#
# NOTE: IS NULL on JSONB-extracted values (e.g. doc ->> 'field' IS NULL)
#   causes PowerSync to silently drop the stream. Use the ifnull() pattern
#   instead: ifnull(doc ->> 'field', '') = '' (for null-or-missing checks).
#
# JWT claims expected in auth token:
#   sub:                    user_id (e.g., "org.couchdb.user:chw_user")
#   contact_id:             user's contact person document ID (UUID)
#   role_hash:              MD5 of sorted roles (for purge group lookup)
#   report_depth:           max depth for other users' reports (-1 = unlimited)
#   can_view_unallocated:   "true" if user may see reports without a subject
#
# BUCKET CONSOLIDATION STRATEGY:
# Streams are grouped by shared CTE to minimize bucket count. All queries
# within a stream sharing the same CTE share bucket instances (confirmed
# empirically — see context/POWERSYNC_BUCKET_ARCHITECTURE_TRADEOFFS.md).
#
# Before consolidation: 4*N + M + 4 buckets (separate streams per doc type)
# After consolidation:  N + M + 5 buckets (CTE-grouped streams)
#
# For a user with 1,010 facilities: ~2,500 buckets (down from ~5,050).
#
# Table aliases in FROM clauses determine client-side table names
# (PowerSync edition 3 row_type). Different queries in one stream
# CAN have different aliases to feed different client tables.
#
# NOTE ON SUBJECT RESOLUTION PARITY:
# CHT's docs_by_replication_key CouchDB view resolves report subjects as:
#   patient_id -> fields.patient_id -> place_id -> fields.place_id
#   -> fields.patient_uuid -> contact._id -> _unassigned
# The view does NOT check: doc.patient_uuid (top-level), doc.place_uuid,
# or doc.fields.place_uuid. However, shared-libs/registration-utils DOES
# check all of these (including place_uuid). Our Sync Streams intentionally
# match registration-utils for forward compatibility, accepting minor
# over-replication vs the CouchDB view for these rare edge cases.

config:
  edition: 3

streams:
  # ================================================================
  # ACCESSIBLE DATA — contacts, SMS, targets
  # ================================================================
  # Consolidated stream for queries filtered by accessible_facilities.
  # Each query references the CTE exactly once, so all 3 share bucket
  # instances: N buckets total.
  #
  # needs_signoff was moved to report_data because its 5-level ancestor
  # chain walk has 5 IN accessible_facilities references, creating extra
  # bucket keys that inflated this stream's count to 2×N.
  #
  # Table aliases determine client-side table names (edition 3 row_type):
  #   contacts     → client "contacts" table
  #   sms_messages → client "sms_messages" table
  #   targets      → client "targets" table
  accessible_data:
    auto_subscribe: true
    priority: 1
    with:
      accessible_facilities: |
        SELECT facility_id
        FROM "v1"."user_accessible_facilities"
        WHERE user_id = auth.user_id()
    queries:
      # -- Contacts --
      # Hierarchical filtering by facility + replication depth.
      # user_accessible_facilities is pre-expanded (Step 1.5 in setup.sql)
      # to include direct children of all descendant contacts, so a single
      # _id IN check is sufficient — no OR on parent needed.
      - |
        SELECT
          contacts._id AS id,
          contacts.doc ->> 'name' AS name,
          ifnull(contacts.doc ->> 'contact_type', contacts.doc ->> 'type') AS contact_type,
          ifnull(contacts.doc -> 'parent' ->> '_id', contacts.doc ->> 'parent') AS parent_id,
          contacts.doc ->> 'patient_id' AS patient_id,
          contacts.doc ->> 'place_id' AS place_id,
          contacts.doc ->> 'phone' AS phone,
          contacts.doc ->> 'date_of_birth' AS date_of_birth,
          contacts.doc ->> 'sex' AS sex,
          contacts.doc ->> 'reported_date' AS reported_date,
          CAST(contacts.doc AS TEXT) AS doc
        FROM "v1"."couchdb" contacts
        WHERE contacts._deleted != true
          AND contacts.doc ->> 'type' IN '["contact", "person", "clinic", "health_center", "district_hospital"]'
          AND contacts._id IN accessible_facilities
      # -- SMS Messages --
      # data_records without a form field are SMS/messages.
      # Replication key is doc.contact._id (the sender).
      # NOTE: Uses ifnull() instead of IS NULL because PowerSync silently
      # drops streams that use IS NULL on JSONB-extracted values.
      - |
        SELECT
          sms_messages._id AS id,
          sms_messages.doc -> 'contact' ->> '_id' AS contact_id,
          sms_messages.doc ->> 'reported_date' AS reported_date,
          sms_messages.doc ->> 'kujua_message' AS is_outgoing,
          CAST(sms_messages.doc AS TEXT) AS doc
        FROM "v1"."couchdb" sms_messages
        WHERE sms_messages._deleted != true
          AND sms_messages.doc ->> 'type' = 'data_record'
          AND ifnull(sms_messages.doc ->> 'form', '') = ''
          AND sms_messages.doc -> 'contact' ->> '_id' IN accessible_facilities
      # -- Targets --
      # target.owner = contact UUID. Syncs to any user who can see
      # the owner contact (supervisors see subordinate targets).
      - |
        SELECT
          targets._id AS id,
          targets.doc ->> 'owner' AS owner,
          targets.doc ->> 'reporting_period' AS reporting_period,
          CAST(targets.doc -> 'targets' AS TEXT) AS targets_data,
          CAST(targets.doc AS TEXT) AS doc
        FROM "v1"."couchdb" targets
        WHERE targets._deleted != true
          AND targets.doc ->> 'type' = 'target'
          AND targets.doc ->> 'owner' IN accessible_facilities

  # ================================================================
  # REPORT DATA — subject-matched + own + needs_signoff reports
  # ================================================================
  # Three query groups, two CTEs:
  #   report_facilities      → subject-matched reports (M buckets)
  #   accessible_facilities  → needs_signoff ancestor chain (separate bucket set)
  #   auth.parameter         → own reports (1 bucket)
  #
  # Subject matching uses the pre-resolved report_subjects table (setup.sql
  # section 7). Each report maps to a single subject UUID. Uses a nested
  # subquery (not INNER JOIN) to avoid JOIN-induced bucket keys.
  # report_facilities contains UUIDs only (no shortcodes).
  #
  # needs_signoff is here (not in accessible_data) because its 5-level
  # ancestor chain walk creates 5 IN accessible_facilities references,
  # which would inflate accessible_data's shared bucket count.
  #
  # Buckets: M (report_facilities) + N_signoff (accessible_facilities) + 1 (own)
  report_data:
    auto_subscribe: true
    priority: 2
    with:
      report_facilities: |
        SELECT facility_id
        FROM "v1"."user_report_facilities"
        WHERE user_id = auth.user_id()
      accessible_facilities: |
        SELECT facility_id
        FROM "v1"."user_accessible_facilities"
        WHERE user_id = auth.user_id()
    queries:
      # Query 1: Reports whose pre-resolved subject matches report_facilities.
      # INNER JOIN report_subjects maps each report to its resolved subject UUID.
      # Nested subquery was tested but created MORE bucket keys (3,672 vs 1,651).
      - |
        SELECT
          reports._id AS id,
          reports.doc ->> 'form' AS form,
          reports.doc ->> 'patient_id' AS patient_id,
          reports.doc -> 'contact' ->> '_id' AS submitter_id,
          reports.doc ->> 'reported_date' AS reported_date,
          reports.doc -> 'fields' ->> 'private' AS is_private,
          reports.doc -> 'fields' ->> 'needs_signoff' AS needs_signoff,
          CAST(reports.doc -> 'fields' AS TEXT) AS fields,
          CAST(reports.doc AS TEXT) AS doc
        FROM "v1"."couchdb" reports
        INNER JOIN "v1"."report_subjects" rs
          ON rs.report_id = reports._id
        WHERE reports._deleted != true
          AND reports.doc ->> 'type' = 'data_record'
          AND reports.doc ->> 'form' IS NOT NULL
          AND rs.subject_id IN report_facilities
          AND (
            ifnull(reports.doc -> 'fields' ->> 'private', 'false') != 'true'
            OR reports.doc -> 'contact' ->> '_id' = auth.parameter('contact_id')
          )
      # Query 2: User's own reports (submitter = user's contact_id)
      # Own reports always sync regardless of report_depth or privacy.
      - |
        SELECT
          reports._id AS id,
          reports.doc ->> 'form' AS form,
          reports.doc ->> 'patient_id' AS patient_id,
          reports.doc -> 'contact' ->> '_id' AS submitter_id,
          reports.doc ->> 'reported_date' AS reported_date,
          reports.doc -> 'fields' ->> 'private' AS is_private,
          reports.doc -> 'fields' ->> 'needs_signoff' AS needs_signoff,
          CAST(reports.doc -> 'fields' AS TEXT) AS fields,
          CAST(reports.doc AS TEXT) AS doc
        FROM "v1"."couchdb" reports
        WHERE reports._deleted != true
          AND reports.doc ->> 'type' = 'data_record'
          AND reports.doc ->> 'form' IS NOT NULL
          AND reports.doc -> 'contact' ->> '_id' = auth.parameter('contact_id')
      # Query 3: needs_signoff reports (moved from accessible_data).
      # Walks 5 levels of submitter ancestor chain to find supervisors.
      # Uses accessible_facilities CTE (separate bucket set from report_facilities).
      - |
        SELECT
          reports._id AS id,
          reports.doc ->> 'form' AS form,
          reports.doc ->> 'patient_id' AS patient_id,
          reports.doc -> 'contact' ->> '_id' AS submitter_id,
          reports.doc ->> 'reported_date' AS reported_date,
          reports.doc -> 'fields' ->> 'private' AS is_private,
          reports.doc -> 'fields' ->> 'needs_signoff' AS needs_signoff,
          CAST(reports.doc -> 'fields' AS TEXT) AS fields,
          CAST(reports.doc AS TEXT) AS doc
        FROM "v1"."couchdb" reports
        WHERE reports._deleted != true
          AND reports.doc ->> 'type' = 'data_record'
          AND reports.doc ->> 'form' IS NOT NULL
          AND reports.doc -> 'fields' ->> 'needs_signoff' = 'true'
          AND (
            reports.doc -> 'contact' ->> '_id' IN accessible_facilities
            OR reports.doc -> 'contact' -> 'parent' ->> '_id' IN accessible_facilities
            OR reports.doc -> 'contact' -> 'parent' -> 'parent' ->> '_id' IN accessible_facilities
            OR reports.doc -> 'contact' -> 'parent' -> 'parent' -> 'parent' ->> '_id' IN accessible_facilities
            OR reports.doc -> 'contact' -> 'parent' -> 'parent' -> 'parent' -> 'parent' ->> '_id' IN accessible_facilities
          )
          AND (
            ifnull(reports.doc -> 'fields' ->> 'private', 'false') != 'true'
            OR reports.doc -> 'contact' ->> '_id' = auth.parameter('contact_id')
          )

  # ================================================================
  # UNASSIGNED REPORTS
  # ================================================================
  # Reports without any subject get _unassigned key in CHT.
  # Only users with can_view_unallocated_data_records permission
  # (passed as JWT claim can_view_unallocated) can see these.
  #
  # Uses ifnull() instead of IS NULL because PowerSync silently
  # drops streams that use IS NULL on JSONB-extracted values.
  # All REPORT_SUBJECT_PROPERTIES + contact._id must be empty.
  #
  # Alias is "reports" so rows go to the same client table as
  # report_data and accessible_data report queries.
  unassigned_reports:
    auto_subscribe: true
    priority: 3
    query: |
      SELECT
        reports._id AS id,
        reports.doc ->> 'form' AS form,
        reports.doc ->> 'patient_id' AS patient_id,
        reports.doc -> 'contact' ->> '_id' AS submitter_id,
        reports.doc ->> 'reported_date' AS reported_date,
        reports.doc -> 'fields' ->> 'private' AS is_private,
        reports.doc -> 'fields' ->> 'needs_signoff' AS needs_signoff,
        CAST(reports.doc -> 'fields' AS TEXT) AS fields,
        CAST(reports.doc AS TEXT) AS doc
      FROM "v1"."couchdb" reports
      WHERE reports._deleted != true
        AND reports.doc ->> 'type' = 'data_record'
        AND reports.doc ->> 'form' IS NOT NULL
        AND ifnull(reports.doc ->> 'patient_id', '') = ''
        AND ifnull(reports.doc -> 'fields' ->> 'patient_id', '') = ''
        AND ifnull(reports.doc ->> 'place_id', '') = ''
        AND ifnull(reports.doc -> 'fields' ->> 'place_id', '') = ''
        AND ifnull(reports.doc ->> 'patient_uuid', '') = ''
        AND ifnull(reports.doc -> 'fields' ->> 'patient_uuid', '') = ''
        AND ifnull(reports.doc ->> 'place_uuid', '') = ''
        AND ifnull(reports.doc -> 'fields' ->> 'place_uuid', '') = ''
        AND ifnull(reports.doc -> 'contact' ->> '_id', '') = ''
        AND auth.parameter('can_view_unallocated') = 'true'

  # ================================================================
  # TASKS
  # ================================================================
  # task.user = CouchDB user ID ("org.couchdb.user:xxx"), NOT contact UUID.
  # Direct auth.user_id() filter = 1 bucket per user.
  tasks:
    auto_subscribe: true
    priority: 3
    query: |
      SELECT
        tasks._id AS id,
        tasks.doc ->> 'user' AS task_user,
        tasks.doc ->> 'owner' AS owner,
        tasks.doc ->> 'requester' AS requester,
        tasks.doc ->> 'state' AS state,
        tasks.doc ->> 'emission' AS emission_id,
        tasks.doc ->> 'dueDate' AS due_date,
        tasks.doc ->> 'startDate' AS start_date,
        tasks.doc ->> 'endDate' AS end_date,
        CAST(tasks.doc AS TEXT) AS doc
      FROM "v1"."couchdb" tasks
      WHERE tasks._deleted != true
        AND tasks.doc ->> 'type' = 'task'
        AND tasks.doc ->> 'user' = auth.user_id()

  # ================================================================
  # GLOBAL CONFIG — all users, no filtering
  # ================================================================
  # Matches the _all replication key in CHT's docs_by_replication_key.
  # By type: form, translations
  # By _id: resources, branding, partners, service-worker-meta,
  #         zscore-charts, settings, privacy-policies,
  #         _design/medic-client (always allowed per authorization.js)
  # No user filter = 1 shared global bucket.
  global_config:
    auto_subscribe: true
    priority: 1
    queries:
      - |
        SELECT
          global_config._id AS id,
          global_config.doc ->> 'type' AS doc_type,
          CAST(global_config.doc AS TEXT) AS doc
        FROM "v1"."couchdb" global_config
        WHERE global_config._deleted != true
          AND global_config.doc ->> 'type' IN '["form", "translations"]'
      - |
        SELECT
          global_config._id AS id,
          global_config.doc ->> 'type' AS doc_type,
          CAST(global_config.doc AS TEXT) AS doc
        FROM "v1"."couchdb" global_config
        WHERE global_config._deleted != true
          AND global_config._id IN '["resources", "branding", "partners", "service-worker-meta", "zscore-charts", "settings", "privacy-policies", "_design/medic-client"]'

  # ================================================================
  # USER SETTINGS DOC
  # ================================================================
  # User's own org.couchdb.user:<username> document.
  # Direct auth.user_id() filter = 1 bucket per user.
  user_settings_doc:
    auto_subscribe: true
    priority: 1
    query: |
      SELECT
        user_settings_doc._id AS id,
        user_settings_doc.doc ->> 'type' AS doc_type,
        CAST(user_settings_doc.doc AS TEXT) AS doc
      FROM "v1"."couchdb" user_settings_doc
      WHERE user_settings_doc._deleted != true
        AND user_settings_doc._id = auth.user_id()

  # ================================================================
  # USER META — feedback, telemetry, read status
  # ================================================================
  # Uses substring+instr instead of LIKE (not supported).
  # Matches _id prefixes: telemetry-, feedback-, read:report:
  # Direct auth.user_id() filter = 1 bucket per user.
  user_meta:
    auto_subscribe: true
    priority: 3
    query: |
      SELECT
        user_meta._id AS id,
        user_meta.doc ->> 'type' AS meta_type,
        user_meta.doc ->> 'user' AS user_id,
        CAST(user_meta.doc AS TEXT) AS doc
      FROM "v1"."couchdb" user_meta
      WHERE user_meta._deleted != true
        AND (
          substring(user_meta._id, 1, 10) = 'telemetry-'
          OR substring(user_meta._id, 1, 9) = 'feedback-'
          OR substring(user_meta._id, 1, 12) = 'read:report:'
        )
        AND user_meta.doc ->> 'user' = auth.user_id()
