# Agent containers for CHT PostgreSQL migration refactor
# Each agent runs in an isolated git worktree on the shared cht-net network
#
# Usage:
#   docker compose -f docker-compose.agents.yml up -d
#   docker compose -f docker-compose.agents.yml up -d agent-1 agent-4 agent-7  # start subset
#
# Prerequisites:
#   1. CouchDB running on cht-net (~/cht-docker)
#   2. Worktrees created via scripts/setup-worktrees.sh
#   3. .env file populated (copy from .env.example)
#   4. First run: docker exec -it cht-agent-1 claude  (OAuth login once, shared across all agents)

x-agent-base: &agent-base
  build:
    context: .
    dockerfile: Dockerfile
  stdin_open: true
  tty: true
  restart: unless-stopped
  networks:
    - cht-net
  # Git safety (5 layers):
  #   1. No SSH keys / no ~/.gitconfig mounted (credentials never enter container)
  #   2. Dockerfile: system-level git pushInsteadOf → error:// for all GitHub URLs
  #   3. .git/config: hardened by setup-worktrees.sh on host (remotes → /dev/null)
  #   4. init-agent-git.sh: pre-push hook, env-based identity, verification
  #   5. CLAUDE.md: explicit "no push/fetch/pull" instructions
  #
  # Claude Code auth: single shared named volume (claude-config) stores OAuth
  # credentials. Log in once on any agent, all agents share the token.
  # Entrypoint runs as root to fix named volume ownership (Docker creates them as root),
  # then drops to agent user for git safety init and sleep.
  user: root
  entrypoint: ["/bin/bash", "-c", "chown -R 1000:1000 /home/agent/.npm /home/agent/.claude /workspace/cht-core/.agents/worktrees/agent-$$AGENT_ID/node_modules 2>/dev/null; exec su agent -c 'cd /workspace/cht-core/.agents/worktrees/agent-'$$AGENT_ID' && bash /workspace/cht-core/.devcontainer/scripts/init-agent-git.sh; exec sleep infinity'"]
  environment: &agent-env
    CHT_NETWORK: ${CHT_NETWORK:-cht-net}
    COUCH_URL: http://${COUCHDB_USER:-admin}:${COUCHDB_PASSWORD}@couchdb:5984/medic
    CLAUDE_CONFIG_DIR: /home/agent/.claude
    NODE_ENV: development
    LOG_LEVEL: debug
  deploy:
    resources:
      limits:
        memory: ${AGENT_MEMORY_LIMIT:-4G}
        cpus: "${AGENT_CPU_LIMIT:-2}"

services:
  agent-1:
    <<: *agent-base
    container_name: cht-agent-1
    hostname: agent-1
    environment:
      <<: *agent-env
      AGENT_ID: "1"
      AGENT_NAME: cht-datasource
    volumes:
      - ${CHT_CORE_PATH:-./../}:/workspace/cht-core:rw
      - ${CHT_AI_TOOLS_PATH:-/home/h4reet/ai_medic/cht-ai-tools}:/workspace/cht-ai-tools:ro
      - claude-config:/home/agent/.claude
      - agent-1-node-modules:/workspace/cht-core/.agents/worktrees/agent-1/node_modules
      - shared-npm-cache:/home/agent/.npm
    working_dir: /workspace/cht-core/.agents/worktrees/agent-1

  agent-2:
    <<: *agent-base
    container_name: cht-agent-2
    hostname: agent-2
    environment:
      <<: *agent-env
      AGENT_ID: "2"
      AGENT_NAME: sentinel
    volumes:
