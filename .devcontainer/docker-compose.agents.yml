      - ${CHT_AI_TOOLS_PATH:-/home/h4reet/ai_medic/cht-ai-tools}:/workspace/cht-ai-tools:ro
      - claude-config:/home/agent/.claude
      - agent-7-node-modules:/workspace/cht-core/.agents/worktrees/agent-7/node_modules
      - shared-npm-cache:/home/agent/.npm
    working_dir: /workspace/cht-core/.agents/worktrees/agent-7

volumes:
  shared-npm-cache:
  claude-config:
  agent-1-node-modules:
  agent-2-node-modules:
  agent-3-node-modules:
  agent-4-node-modules:
  agent-5-node-modules:
  agent-6-node-modules:
  agent-7-node-modules:

networks:
  cht-net:
    external: true
    name: ${CHT_NETWORK:-cht-net}
