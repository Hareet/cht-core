      - claude-config:/home/agent/.claude
      - agent-2-node-modules:/workspace/cht-core/.agents/worktrees/agent-2/node_modules
      - shared-npm-cache:/home/agent/.npm
    working_dir: /workspace/cht-core/.agents/worktrees/agent-2

  agent-3:
    <<: *agent-base
    container_name: cht-agent-3
    hostname: agent-3
    environment:
      <<: *agent-env
      AGENT_ID: "3"
      AGENT_NAME: sync-streams
    volumes:
      - ${CHT_CORE_PATH:-./../}:/workspace/cht-core:rw
      - ${CHT_AI_TOOLS_PATH:-/home/h4reet/ai_medic/cht-ai-tools}:/workspace/cht-ai-tools:ro
      - claude-config:/home/agent/.claude
      - agent-3-node-modules:/workspace/cht-core/.agents/worktrees/agent-3/node_modules
      - shared-npm-cache:/home/agent/.npm
    working_dir: /workspace/cht-core/.agents/worktrees/agent-3

  agent-4:
    <<: *agent-base
    container_name: cht-agent-4
    hostname: agent-4
