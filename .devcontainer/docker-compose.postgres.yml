# Phase 2: PostgreSQL + couch2pg (from cht-sync)
# Adds PostgreSQL and the CouchDB->PG replication bridge.
# couch2pg is built from the cloned cht-sync repo at ~/ai_medic/cht-sync.
#
# Prerequisites:
#   1. Phase 1 services running
#   2. .env file has POSTGRES_PASSWORD set
#   3. cht-sync cloned: git clone https://github.com/medic/cht-sync ~/ai_medic/cht-sync
#
# Usage:
#   docker compose -f docker-compose.postgres.yml up -d
#   docker exec cht-postgres pg_isready -U cht -d cht
#   ./scripts/phase-gate.sh approve 2

services:
  postgres:
    image: postgres:16-alpine
    container_name: cht-postgres
    hostname: postgres
    restart: always
    environment:
      - POSTGRES_DB=cht
      - POSTGRES_USER=${POSTGRES_USER:-cht}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      - POSTGRES_TABLES=medic
      - POSTGRES_SCHEMA=v1
    volumes:
      - cht-pgdata:/var/lib/postgresql/data
      - ${CHT_SYNC_PATH:-/home/h4reet/ai_medic/cht-sync}/postgres/init-dbt-resources.sh:/docker-entrypoint-initdb.d/init-dbt-resources.sh:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cht} -d cht"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging:
      driver: "local"
      options:
        max-size: "50m"
        max-file: "20"
    networks:
      - cht-net
    deploy:
      resources:
        limits:
          memory: 4G
    command: >
      postgres
        -c shared_buffers=1GB
        -c work_mem=20MB
        -c jit=off
        -c wal_level=logical
        -c max_replication_slots=4
        -c max_wal_senders=4

  couch2pg:
    build:
      context: ${CHT_SYNC_PATH:-/home/h4reet/ai_medic/cht-sync}/couch2pg
    container_name: cht-couch2pg
    hostname: couch2pg
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - COUCHDB_USER=${COUCHDB_USER:-admin}
      - COUCHDB_PASSWORD=${COUCHDB_PASSWORD}
      - COUCHDB_HOST=couchdb
      - COUCHDB_PORT=5984
      - COUCHDB_SECURE=false
      - COUCHDB_DBS=medic
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-cht}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=cht
      - POSTGRES_SCHEMA=v1
      - POSTGRES_TABLE=couchdb
      - DATAEMON_INTERVAL=5
    logging:
      driver: "local"
      options:
        max-size: "50m"
        max-file: "20"
    networks:
      - cht-net

volumes:
  cht-pgdata:

networks:
  cht-net:
    external: true
    name: ${CHT_NETWORK:-cht-net}
